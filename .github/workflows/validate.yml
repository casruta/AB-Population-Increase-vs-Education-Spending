name: Validate publication

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Validate evidence and calculations
        run: python -m unittest -v test_generate_all_charts
      - name: Build publication offline
        run: python generate_all_charts.py --output-dir validation-output
